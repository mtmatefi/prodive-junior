name: release
on: { push: { branches: [dist] } }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(jq -r .versionName latest.json)
          gh release create "v$V" ProDive-Junior.apk latest.json -R "$GITHUB_REPOSITORY" -t "ProDive Junior – Riffretter $V" -n "$(jq -r .notes.de latest.json)" --latest
